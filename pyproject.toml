[project]
name = "depa_downstream"
version = "0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "pandas>=2.0,<3", "scipy>=1.10", "statsmodels>=0.14",
    "scikit-learn>=1.3", "matplotlib>=3.7", "requests>=2.31", "PyYAML>=6",
    "anndata>=0.10", "pyreadr>=0.5",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
depa-analyze = "depa_downstream.pipeline:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["depa_downstream"]
